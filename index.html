<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Weather App</h1>
    <div id="main">
        <div id="searchSection">
            <input id="inputCity" type="text" placeholder="Search city"></input>
            <button id="searchButton">Search</button>
        </div>
        <div id="displaySection">
            <h5>Search a city for weather details</h5>

            <h4 id="city"></h4>
            <img id="icon">

            <h2 id="temp"></h2>
            <h4 id="condition"></h4>

            <div id="humidity"></div>
            <div id="wind"></div>
            
        </div>
    </div>


    <script src="script.js"></script>
</body>
</html>
